[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter
    "F401",   # unused imports — some are re-exports
    "E402",   # module level import not at top — needed for spark setup
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E712"]

[tool.pytest.ini_options]
testpaths = ["tests"]
